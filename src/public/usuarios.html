<!doctype html>
<html lang="pt-BR">
<head>
  <script src="/painel/js/sessao.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários | Painel | Belo Norte</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/modulos.js" defer></script>
</head>
<body class="tela-usuarios">
  <header class="topo">
    <div>
      <p class="marca">Belo Norte</p>
      <h1>Usuários do painel</h1>
    </div>
    <div class="topo-acoes">
      <nav id="modulos" class="modulos" aria-label="Módulos do painel" hidden></nav>
      <button class="botao-texto" type="button">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <section class="bloco" aria-labelledby="titulo-acesso">
      <h2 id="titulo-acesso">Liberação de acesso</h2>
      <p class="bloco__descricao">Aprove quem pediu acesso e marque as telas que cada pessoa pode ver. As mudanças valem na hora.</p>

      <p id="mensagem" class="mensagem" role="status">Carregando...</p>
      <p id="resumo" class="resumo-usuarios"></p>

      <div class="tabela-rolagem">
        <table id="tabela" class="tabela" hidden>
          <thead>
            <tr>
              <th scope="col">Nome</th>
              <th scope="col">Cadastro</th>
              <th scope="col">Situação</th>
              <th scope="col">Telas liberadas</th>
              <th scope="col"><span class="sr-only">Salvar</span></th>
            </tr>
          </thead>
          <tbody id="linhas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/usuarios.js"></script>
  <script>
    // Menu de módulos igual ao das outras telas, com "Usuários" marcado
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        modulos.desenharMenu(await modulos.setoresDaChave(), 'usuarios');
        const menu = document.getElementById('modulos');
        if (!document.getElementById('menu-usuarios')) {
          const atual = document.createElement('span');
          atual.id = 'menu-usuarios';
          atual.className = 'modulo modulo--ativo';
          atual.textContent = 'Usuários';
          menu.append(atual);
          menu.hidden = false;
        }
      } catch (_) { /* sem menu: a tela continua funcionando */ }
    });
  </script>
</body>
</html>
