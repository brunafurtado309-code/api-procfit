<!doctype html>
<html lang="pt-BR">
<head>
  <script src="/painel/js/sessao.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha senha | Painel | Belo Norte</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/modulos.js" defer></script>
  <script src="js/conta.js" defer></script>
</head>
<body class="tela-conta">
  <header class="topo">
    <div>
      <p class="marca">Belo Norte</p>
      <h1>Minha senha</h1>
    </div>
    <div class="topo-acoes">
      <nav id="modulos" class="modulos" aria-label="Módulos do painel" hidden></nav>
      <button class="botao-texto" type="button">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <section class="bloco" aria-labelledby="titulo-senha">
      <h2 id="titulo-senha">Trocar a senha</h2>
      <p id="aviso-provisoria" class="conta__aviso" hidden>
        Você entrou com uma <strong>senha provisória</strong>. Crie a sua senha nova para continuar usando o painel.
      </p>
      <p class="bloco__descricao">Depois de trocar, o painel continua aberto aqui, e você sai dos outros computadores e celulares em que estava conectada(o).</p>

      <form id="form-senha" class="conta__form">
        <label>Senha atual (ou a provisória) <input type="password" id="senha-atual" autocomplete="current-password" required></label>
        <label>Senha nova <input type="password" id="senha-nova" minlength="8" autocomplete="new-password" required><small>Mínimo de 8 caracteres</small></label>
        <label>Repita a senha nova <input type="password" id="senha-nova2" minlength="8" autocomplete="new-password" required></label>
        <button type="submit">Salvar senha nova</button>
      </form>

      <p id="mensagem" class="mensagem" role="status"></p>
    </section>
  </main>
</body>
</html>
