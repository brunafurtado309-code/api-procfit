<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Painel | Belo Norte</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="tela-login">
  <main class="login">
    <!-- Faixa da marca (vira o topo no celular) -->
    <section class="login__marca" aria-label="Belo Norte">
      <p class="marca">Belo Norte</p>
      <div>
        <h1 class="login__titulo">Painel de gestão</h1>
        <p class="login__texto">Vendas, faturamento e financeiro da Belo Norte num lugar só, com os dados direto do PROCFIT.</p>
      </div>
      <ul class="login__modulos" aria-label="Módulos do painel">
        <li>Vendas</li>
        <li>Faturamento</li>
        <li>Financeiro</li>
      </ul>
    </section>

    <!-- Entrar / criar conta -->
    <section class="login__area">
      <div class="login__form-area">
        <h2>Bem-vinda(o)</h2>
        <p class="login__sub">Entre com sua conta ou peça acesso ao painel.</p>

        <nav class="login__abas" aria-label="Entrar ou criar conta">
          <button type="button" id="aba-entrar" class="aba ativa">Entrar</button>
          <button type="button" id="aba-criar" class="aba">Criar conta</button>
        </nav>

        <form id="form-entrar" class="login__form">
          <label>E-mail <input type="email" id="entrar-email" autocomplete="username" required></label>
          <label>Senha <input type="password" id="entrar-senha" autocomplete="current-password" required></label>
          <button type="submit">Entrar</button>
        </form>

        <form id="form-criar" class="login__form" hidden>
          <label>Nome <input id="criar-nome" autocomplete="name" required></label>
          <label>E-mail <input type="email" id="criar-email" autocomplete="email" required></label>
          <label>Senha <input type="password" id="criar-senha" minlength="8" autocomplete="new-password" required><small>Mínimo de 8 caracteres</small></label>
          <label>Repita a senha <input type="password" id="criar-senha2" minlength="8" autocomplete="new-password" required></label>
          <button type="submit">Enviar cadastro</button>
        </form>

        <p id="mensagem" class="mensagem" role="status"></p>
      </div>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
